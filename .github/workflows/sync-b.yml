name: Repository sync B
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: read
concurrency:
  group: repository-sync-b
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Synchronize
        env:
          SOURCE_URL: ${{ secrets.SYNC_B_SOURCE_URL }}
          BACKUP_URL: ${{ secrets.SYNC_B_BACKUP_URL }}
          SYNC_KEY: ${{ secrets.SYNC_B_KEY }}
        run: python3 sync.py
